# Goes in the nginx http context: /etc/nginx/conf.d/00-pulse.conf
#
# The name must sort before dokku.conf, which is what pulls in the app vhosts
# (`include /home/dokku/*/nginx.conf`). A log_format is resolved while the
# vhost is being parsed, so declaring it later fails the whole config with
# "unknown log format". A limit_req zone resolves after parsing and is not
# order-sensitive, which is why the rate limit worked and the log format did
# not.
#
# Declaring a zone has no effect on its own; only the app vhost that references
# it is limited (see nginx-app-ratelimit.conf), so this file is inert for every
# other app on the host.
#
# $binary_remote_addr is the real client because the vhost sets real_ip from
# Cloudflare's ranges (SPEC §5.3), so the limit applies whether a request
# arrives through the CDN or straight at the origin.
#
# 5r/s is absurdly generous for a client that beats once a minute, and still
# caps a single address far below what would queue behind the single SQLite
# connection. 10m holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=pulse_api:10m rate=5r/s;
