# Goes in the app's server context: /home/dokku/pulse/nginx.conf.d/ratelimit.conf
#
# limit_req is set at server level rather than in a location block: dokku owns
# `location /` and does not set limit_req, so it inherits this. Adding our own
# location would mean restating dokku's proxy_pass and drifting from it on
# upgrade.
#
# burst absorbs a panel opening several history requests at once; nodelay lets
# that burst through immediately instead of queueing it.
limit_req zone=pulse_api burst=20 nodelay;
limit_req_status 429;

# No request log at all. The vhost's default line writes the client address
# next to a timestamp and a path, which is exactly what the opt-in screen
# promises does not happen. `off` is what cancels it: access_log is additive in
# nginx, so an anonymous format added alongside would log twice rather than
# replace, and `off` cancels every access_log at this level including one added
# after it. An anonymised format was therefore dropped rather than kept as
# decoration.
access_log off;

# nginx error diagnostics embed the client address and cannot be formatted.
# error_log has no `off` and is additive, so the vhost's own line at the
# default `error` level cannot be removed the way access_log can — the level
# of the *message* is what has to move instead. limit_req reports at `error`
# by default, which is why a rate-limited flood was still landing in the file
# with an address attached; at `info` it falls below every error_log threshold
# on this vhost and is written nowhere.
#
# The cost is real and deliberate: a flood leaves no trace here. It is
# affordable because the limit already makes a flood harmless, volumetric
# visibility is available from the CDN's own analytics without Pulse storing
# anything, and an unconditional promise is worth more to this product than an
# attacker's address.
limit_req_log_level info;
